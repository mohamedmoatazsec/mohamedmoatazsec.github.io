<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Home">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">mohamedmoatazsec</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/writeups/' | relative_url }}"{% if page.url contains '/writeups/' %} aria-current="page"{% endif %}>Write-ups</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      <a href="https://github.com/{{ site.social.github }}" rel="me">GitHub</a>
      <a href="https://www.linkedin.com/in/{{ site.social.linkedin }}" rel="me">LinkedIn</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch colour theme" title="Switch theme">
        <svg class="icon icon--sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="icon icon--moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </nav>
  </div>
</header>
